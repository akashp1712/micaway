name: Voice-app compatibility report
description: Share a successful or unsuccessful MicAway test.
title: "[Compatibility]: "
labels:
  - compatibility
body:
  - type: markdown
    attributes:
      value: Thanks for testing MicAway. Never include private dictated text or an audio recording.
  - type: input
    id: voice-app
    attributes:
      label: Voice app and version
      placeholder: FluidVoice 0.x
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.6
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model
      placeholder: MacBook Air (M3)
    validations:
      required: true
  - type: input
    id: airpods
    attributes:
      label: AirPods model
      placeholder: AirPods Pro (2nd generation)
    validations:
      required: true
  - type: input
    id: input
    attributes:
      label: Selected input device
      placeholder: MacBook Air Microphone
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Muted and restored correctly
        - Muted but did not restore correctly
        - Did not mute
        - Could not calibrate
        - Other
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Reproduction notes
      description: Describe the device and app behavior only. Do not paste dictated content.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed this report and removed private dictated text, recordings, and credentials.
          required: true
