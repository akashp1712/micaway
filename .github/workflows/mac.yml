name: Mac app

on:
  push:
    paths:
      - "apps/mac/**"
      - ".github/workflows/mac.yml"
  pull_request:
    paths:
      - "apps/mac/**"
      - ".github/workflows/mac.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/mac
    steps:
      - uses: actions/checkout@v4
      - name: Test intent engine
        run: swift test
      - name: Build release bundle
        run: bash scripts/build-app.sh
      - name: Package test build
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Hear Me Not.app" "dist/HearMeNot-macOS.zip"
      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: HearMeNot-macOS
          path: apps/mac/dist/HearMeNot-macOS.zip
          if-no-files-found: error
